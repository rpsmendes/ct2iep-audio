# Factory TX processing chain (equivalent to the Waveform chain).
# Order = signal order. This is the initial chain and what "Factory chain" in
# the UI restores; the running chain (order, blocks, values) lives in
# data/state.json. After editing: docker compose restart web
#
# Parameter values are in the plugin's units.
# Gains can be written in dB (e.g. "-40dB"): converted to a linear coefficient.
# "main" = parameters shown directly in the UI; the rest go under "Advanced".
# "bypass: true" = block loaded but switched off (switch it on in the UI).
# meters: kind "level" (level, -60..0 dB) or "gr" (gain reduction).

io:
  # microphone input (channel 1 of the main card)
  inputs: ["system:capture_1"]
  # outputs: main card (L+R). For the FTDX USB use
  #   ["ftdx_out:playback_1", "ftdx_out:playback_2"]   (and FTDX_CARD in .env)
  outputs: ["system:playback_1", "system:playback_2"]

blocks:
  - id: gate
    name: Gate
    replaces: Waves C1 gate
    uri: http://lsp-plug.in/plugins/lv2/gate_mono
    main: [gt, gr, at, rt, gh, ht]
    params: { gt: "-50dB", gr: "-24dB", at: 2, rt: 250, gh: 1, ht: "-56dB" }
    meters:
      - { symbol: ilm, label: "Input" }
      - { symbol: rlm, label: "Gate", kind: gr }

  - id: bass
    name: Bass Enhancer
    replaces: Waves RBass
    uri: http://calf.sourceforge.net/plugins/BassEnhancer
    bypass: true          # lows are cut in SSB anyway; enable only if you want more "body"
    main: [amount, drive, freq, level_out]
    params: { amount: 0.5, drive: 4, freq: 180 }

  - id: eq
    name: Parametric EQ
    replaces: PuigTec MEQ5 + F6 + OneKnob Brighter
    uri: http://lsp-plug.in/plugins/lv2/para_equalizer_x8_mono
    # band 0: high-pass 120 Hz (Butterworth, -3 dB at 120 Hz)
    # band 1: "mud" cut at 300 Hz | band 2: presence at 1.8 kHz
    # band 3: brightness (high shelf) at 2.4 kHz
    # Note: in LSP the "q" sets the width of the Bell filters (q=0 = extremely
    # wide); "Filter Width" (w_N) does not affect Bell filters.
    main: [ft_0, f_0, s_0, ft_1, f_1, g_1, q_1, ft_2, f_2, g_2, q_2, ft_3, f_3, g_3, g_out]
    params:
      ft_0: 2   # Hi-pass
      fm_0: 2   # BWC (BT) = Butterworth
      f_0: 120
      s_0: 1    # x2 (24 dB/octave)
      ft_1: 1   # Bell
      f_1: 300
      g_1: "-3dB"
      q_1: 1
      ft_2: 1   # Bell
      f_2: 1800
      g_2: "3dB"
      q_2: 1
      ft_3: 3   # Hi-shelf
      f_3: 2400
      g_3: "2dB"

  - id: comp
    name: Compressor
    replaces: GW ToneCentric (dynamics)
    uri: http://lsp-plug.in/plugins/lv2/compressor_mono
    main: [al, cr, kn, at, rt, mk]
    params: { al: "-24dB", cr: 4, kn: "-6dB", at: 8, rt: 120, mk: "8dB" }
    meters:
      - { symbol: rlm, label: "Comp", kind: gr }

  - id: sat
    name: Saturation
    replaces: GW ToneCentric (colour)
    uri: http://calf.sourceforge.net/plugins/Saturator
    bypass: true
    main: [drive, blend, mix, level_out]
    params: { drive: 1.5, blend: 0, mix: 0.4 }

  - id: exciter
    name: Exciter
    replaces: La Petite Excite
    uri: http://calf.sourceforge.net/plugins/Exciter
    main: [amount, drive, freq, blend]
    params: { amount: 1, drive: 6, freq: 2000 }

  - id: deesser
    name: De-esser
    replaces: Waves DeEsser
    uri: http://calf.sourceforge.net/plugins/Deesser
    main: [threshold, ratio, f1_freq, f2_freq, f2_level, makeup]
    params: { threshold: "-18dB", ratio: 3, f1_freq: 2500, f2_freq: 2700, f2_level: 4 }
    meters:
      - { symbol: compression, label: "De-ess", kind: gr }

  - id: reverb
    name: Plate Reverb
    replaces: Abbey Road Plates
    uri: urn:dragonfly:plate
    bypass: true          # reverb on TX usually hurts intelligibility
    main: [dry_level, early_level, decay, predelay]
    params: { dry_level: 100, early_level: 8, decay: 0.4 }

  - id: lpf
    name: Low-pass (bandwidth)
    replaces: SSB bandwidth limit
    uri: http://lsp-plug.in/plugins/lv2/filter_mono
    main: [ft, fm, f, s]
    # Butterworth low-pass x4: -0.4 dB at 2.5 kHz, -3 dB at 2.9 kHz, -14 dB at 3.5 kHz
    params: { ft: 0, fm: 2, f: 2900, s: 3 }

  - id: limiter
    name: Limiter
    replaces: Waves L1
    uri: http://lsp-plug.in/plugins/lv2/limiter_mono
    # brickwall at -3 dBFS; 2 ms lookahead (low latency); no oversampling
    main: [g_in, th, lk, rt, g_out]
    params: { g_in: "0dB", th: "-3dB", boost: 0, alr: 0, mode: 0, lk: 2, at: 2, rt: 10, ovs: 0 }
    meters:
      - { symbol: grlm, label: "Limiter", kind: gr }
      - { symbol: olm, label: "Output" }
