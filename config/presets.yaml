# Built-in presets: complete chains tuned for a transmission mode.
# They are read-only in the UI (load one, adjust it, "Save as…" your own).
#
# Each block refers to a block of the factory chain (chain.yaml) by id: it
# starts from the factory values and only the parameters listed here change.
# A block with an id that is not in chain.yaml needs its own "uri".
# The order of the list is the signal order; blocks not listed are left out.
# Gains can be written in dB ("-6dB"), as in chain.yaml.
#
# They are starting points, not final settings: every voice and microphone is
# different. Adjust while listening on a second receiver or a WebSDR, and set
# the level so the radio's ALC barely moves. Turn the radio's own speech
# processor and TX EQ off (or flat) so they do not stack with this chain.
#
# References used for the curves:
#  - ON4FF, "Microphone audio settings" (Yaesu/Flex/Icom DX and contest EQs):
#    cut the lows, keep the mids flat, boost 2-2.4 kHz by 6-10 dB, TX
#    bandwidth ~400-2600 Hz for contests.
#  - NU9N, eSSB transmitter settings: 50 Hz to 3-4 kHz, FTDX101D TTBF option.
#  - Radio World, "The 5 kHz AM reality": AM broadcast audio limited to
#    4.5 kHz in Europe (9 kHz channels), 5 kHz common in the US.
#  - FreeDV, "Getting started": turn all audio processing off for digital voice.

# ---------------------------------------------------------------------------
# Broadcast SSB: full, deep voice with clean peaks, in 3 / 4 / 5 kHz versions.
#
# Signal path (each step has one job, so nothing is pushed into distortion):
#   hpf     48 dB/oct high-pass at 45-70 Hz: removes rumble and the sub-bass
#           part of plosives, which use power and ALC without being heard
#   nr      RNNoise noise suppression (neural network trained on speech), OFF
#           by default: switch it on to compare. Removes steady noise (fans,
#           power supplies) in the pauses completely and partly under the voice;
#           adds ~30 ms of latency. Needs the image built with it.
#   gate    -40 dB in the pauses: the leveler and the compressor add ~30 dB of
#           gain, so without it fans and power supplies come up between words.
#           Opens at -45 dBFS, closes 6 dB lower, 5 ms look-ahead (onsets are
#           not cut), detector high-passed at 200 Hz (ignores hum). Set the
#           threshold ~6 dB above the gate's Input meter in silence.
#   phase   x42 Phaserotate 120 deg: voice is asymmetric (one polarity peaks
#           several dB higher); rotated it is symmetric, measured -1.5 dB peak
#           on the test voice, more on most real voices
#   agc     leveler (3:1, soft knee, 5 ms look-ahead, 10 ms / 1 s): rides the
#           level like an operator, so the rest of the chain always works at
#           the same level; the look-ahead stops word onsets from overshooting
#   eq      the tone: bass shelf, mud and boxiness cuts, presence, air
#   bass    Calf Bass Enhancer: adds harmonics of the 60-120 Hz fundamentals,
#           so the bass is still heard on receivers and speakers that do not
#           reproduce it (Deep and Warm only, low amount)
#   mbc     4-band compressor (160 / 800 / 2400 Hz): each band is controlled
#           on its own, so the bass can be dense without pumping the voice and
#           without eating the transmitter's peak power
#   exciter Calf Exciter, low amount: harmonics of the 2 kHz+ range give clarity
#           and articulation without more 200-500 Hz (against a "muddy" voice)
#   deesser sibilance control (more top end = more "s")
#   lpf     steep low-pass at the bandwidth edge, before the limiter (a filter
#           after the limiter would add overshoot)
#   limiter look-ahead, 2x oversampled, ceiling -1 dBFS: catches only what is
#           left, about 2 % of the time, at most ~8 dB on 10 ms word onsets
#           (inaudible); it is not used to make the voice louder
# Measured on a test voice (peak to loud-speech RMS): raw voice 17 dB, these
# presets 12.5-14.5 dB, i.e. 3-5 dB more talk power at the same peak power,
# with the 63-160 Hz band 2-5 dB up and 250-400 Hz ~2 dB down on the voice.
# Latency of the whole chain: about 60 ms (look-aheads and filters).
# The level to the radio is then set with the Output trim (Chain tab), until
# the radio's ALC barely moves on voice peaks. Radio: speech processor, TX EQ
# and (Zeus) leveler / compressor / CFC OFF, so they do not stack.
#
# Bandwidth on the radios:
#   FTDX-101D  3 kHz: SSB TX BPF 50-3050 Hz. 4 kHz: only with TTBF (hidden
#              menu option, 50 Hz - 4 kHz). 5 kHz: not possible on this radio.
#   Square SDR (Zeus): Settings > TX Filter, low 50 Hz, high 3000/4000/5000 Hz.
# Use the wide versions only where the band has room for them.
#
# Mic (FDUCE SL40X, dynamic cardioid, 50 Hz - 14 kHz): the depth comes from
# the proximity effect: speak at 3-5 cm, always at the same distance, slightly
# off-axis, with a foam/pop filter. Further away = thinner voice.
# ---------------------------------------------------------------------------
x-broadcast:
  # building blocks of the "Broadcast SSB" presets below (YAML anchors)
  hpf: &bc_hpf { id: hpf, name: High-pass, uri: "http://lsp-plug.in/plugins/lv2/filter_mono", main: [f, s],
    info: "Steep high-pass (48 dB/oct): removes rumble, desk thumps and the sub-bass part of plosives, which use transmitter power without being heard.",
    help: { f: "Cut-off (45-70 Hz): higher = tighter, less deep.", s: "Slope: x4 = 48 dB/oct." } }
  # RNNoise noise suppression: off by default (switch it on with its power button to compare);
  # needs the image built with it (docker/Dockerfile), otherwise it says "plugin not installed"
  nr: &bc_nr { id: nr, name: Noise suppression, uri: "https://github.com/werman/noise-suppression-for-voice#mono", bypass: true,
    main: [vad_threshold, vad_grace_period, vad_retroactive_grace_period],
    labels: { vad_threshold: Voice detection threshold, vad_grace_period: "Hold after the voice (x 10 ms)",
      vad_retroactive_grace_period: "Keep before the voice (x 10 ms)" },
    info: "Mutes the output when it hears no voice (the pauses) and lowers steady noise under the voice. These controls only change the voice detection; the reduction itself is fixed. Off by default: switch it on and compare on a second receiver.",
    help: { vad_threshold: "Probability of voice below which the output is muted. Higher: quieter pauses, but weak syllables and word ends may be cut. Lower: more noise gets through. Default 0.6.",
      vad_grace_period: "Stays open this long after the voice stops, so word ends are not cut. Fans heard at the end of phrases: lower it (10-15). Default 20 = 200 ms.",
      vad_retroactive_grace_period: "Keeps this much audio from before the voice was detected, so word starts are kept (s, p). Adds the same delay: 3 = +30 ms. Default 0." } }
  phase: &bc_phase { id: phase, name: Phase rotator, uri: "http://gareus.org/oss/lv2/phaserotate", main: [angle],
    info: "Phase rotator: a voice peaks higher on one side of the waveform; rotated, it is symmetric, so the same loudness has lower peaks (1.5-3 dB) and the limiter works less. Inaudible on its own.",
    help: { angle: "Rotation: 120 is a good start; try 90-150 while watching the limiter's GR meter." },
    params: { angle: 120 } }
  # gate: closes 6 dB below the open threshold (ht is relative), -40 dB when closed, 5 ms
  # look-ahead so word onsets are not cut, detector high-passed at 200 Hz (ignores fan hum)
  gate: &bc_gate { id: gate, params: { gt: "-45dB", ht: "-6dB", gr: "-40dB", at: 1, rt: 200, gh: 1,
      sla: 5, scm: 1, scr: 20, shpm: 2, shpf: 200, slpm: 0 } }
  agc: &bc_agc { id: agc, name: Leveler (AGC), uri: "http://lsp-plug.in/plugins/lv2/compressor_mono",
    main: [al, cr, at, rt, mk], labels: { al: Threshold, cr: Ratio, at: Attack, rt: Release, mk: Makeup },
    info: "Leveler (AGC): slowly rides the level like an operator, so the EQ and the compressors always get the same level, whether you lean in or back off. Its 5 ms look-ahead stops word starts from overshooting.",
    help: { al: "From this level it lowers the voice. Its GR meter shows about 10-20 dB on normal speech.", cr: "How firmly it levels.", at: "How fast it lowers a louder passage.", rt: "How fast it raises the level again: slow = no pumping in the pauses.", mk: "Gain after it: brings the levelled voice to the working level of the next blocks." },
    meters: [{ symbol: rlm, label: AGC, kind: gr }],
    params: { scm: 1, scr: 30, sla: 5, al: "-42.0dB", cr: 3, kn: "-12.0dB",
        at: 10, rt: 1000, mk: "21.0dB" } }
  mbc: &bc_mbc { id: mbc, name: Multiband compressor, uri: "http://lsp-plug.in/plugins/lv2/mb_compressor_mono",
    main: [al_0, cr_0, mk_0, al_2, cr_2, mk_2, al_4, cr_4, mk_4, al_6, cr_6, mk_6],
    labels: { al_0: "Threshold <160 Hz", cr_0: "Ratio <160 Hz", mk_0: "Makeup <160 Hz",
      al_2: "Threshold 160-800 Hz", cr_2: "Ratio 160-800 Hz", mk_2: "Makeup 160-800 Hz",
      al_4: "Threshold 0.8-2.4 kHz", cr_4: "Ratio 0.8-2.4 kHz", mk_4: "Makeup 0.8-2.4 kHz",
      al_6: "Threshold >2.4 kHz", cr_6: "Ratio >2.4 kHz", mk_6: "Makeup >2.4 kHz" },
    info: "4-band compressor: each band is held on its own, so the bass can be dense without pumping the voice. The makeups set the final tone: raise Makeup <160 Hz for more bass, lower Makeup 160-800 Hz against mud. The GR meter of each band should show a few dB on voice.",
    help: {"al_0": "Where this band starts compressing.", "cr_0": "How firmly this band is held.", "mk_0": "Bass: up for deeper, down if it booms.", "al_2": "Where this band starts compressing.", "cr_2": "How firmly this band is held.", "mk_2": "Body and mud: down for a clearer voice.", "al_4": "Where this band starts compressing.", "cr_4": "How firmly this band is held.", "mk_4": "Core of the voice (intelligibility).", "al_6": "Where this band starts compressing.", "cr_6": "How firmly this band is held.", "mk_6": "Presence and s: up for brighter, down if it is harsh."},
    meters: [{ symbol: rlm_0, label: "<160", kind: gr }, { symbol: rlm_2, label: "160-800", kind: gr },
             { symbol: rlm_4, label: "0.8-2.4k", kind: gr }, { symbol: rlm_6, label: ">2.4k", kind: gr }] }
  mbc-deep: &bc_mbc_deep { mode: 1, envb: 0, cbe_1: 0, cbe_2: 1, sf_2: 160, cbe_3: 0,
      cbe_4: 1, sf_4: 800, cbe_5: 0, cbe_6: 1, sf_6: 2400, cbe_7: 0,
      g_in: "0.0dB", g_out: "0.0dB", al_0: "-24.0dB", cr_0: 3, at_0: 15, rt_0: 300,
      mk_0: "9.9dB", kn_0: "-9.0dB", ce_0: 1, scm_0: 1, cm_0: 0, sla_0: 5,
      al_2: "-27.0dB", cr_2: 2.5, at_2: 8, rt_2: 200, mk_2: "4.0dB", kn_2: "-9.0dB",
      ce_2: 1, scm_2: 1, cm_2: 0, sla_2: 5, al_4: "-30.0dB", cr_4: 3,
      at_4: 4, rt_4: 150, mk_4: "4.0dB", kn_4: "-9.0dB", ce_4: 1, scm_4: 1,
      cm_4: 0, sla_4: 5, al_6: "-33.0dB", cr_6: 3, at_6: 2, rt_6: 100,
      mk_6: "9.8dB", kn_6: "-9.0dB", ce_6: 1, scm_6: 1, cm_6: 0, sla_6: 5 }
  mbc-punch: &bc_mbc_punch { mode: 1, envb: 0, cbe_1: 0, cbe_2: 1, sf_2: 160, cbe_3: 0,
      cbe_4: 1, sf_4: 800, cbe_5: 0, cbe_6: 1, sf_6: 2400, cbe_7: 0,
      g_in: "0.0dB", g_out: "0.0dB", al_0: "-26.0dB", cr_0: 4, at_0: 12, rt_0: 200,
      mk_0: "11.7dB", kn_0: "-9.0dB", ce_0: 1, scm_0: 1, cm_0: 0, sla_0: 5,
      al_2: "-29.0dB", cr_2: 3.5, at_2: 6, rt_2: 150, mk_2: "6.3dB", kn_2: "-9.0dB",
      ce_2: 1, scm_2: 1, cm_2: 0, sla_2: 5, al_4: "-32.0dB", cr_4: 4,
      at_4: 3, rt_4: 120, mk_4: "6.0dB", kn_4: "-9.0dB", ce_4: 1, scm_4: 1,
      cm_4: 0, sla_4: 5, al_6: "-35.0dB", cr_6: 4, at_6: 2, rt_6: 80,
      mk_6: "12.2dB", kn_6: "-9.0dB", ce_6: 1, scm_6: 1, cm_6: 0, sla_6: 5 }
  mbc-warm: &bc_mbc_warm { mode: 1, envb: 0, cbe_1: 0, cbe_2: 1, sf_2: 160, cbe_3: 0,
      cbe_4: 1, sf_4: 800, cbe_5: 0, cbe_6: 1, sf_6: 2400, cbe_7: 0,
      g_in: "0.0dB", g_out: "0.0dB", al_0: "-22.0dB", cr_0: 2, at_0: 20, rt_0: 400,
      mk_0: "7.6dB", kn_0: "-9.0dB", ce_0: 1, scm_0: 1, cm_0: 0, sla_0: 5,
      al_2: "-25.0dB", cr_2: 2, at_2: 10, rt_2: 300, mk_2: "2.9dB", kn_2: "-9.0dB",
      ce_2: 1, scm_2: 1, cm_2: 0, sla_2: 5, al_4: "-28.0dB", cr_4: 2,
      at_4: 6, rt_4: 250, mk_4: "2.0dB", kn_4: "-9.0dB", ce_4: 1, scm_4: 1,
      cm_4: 0, sla_4: 5, al_6: "-31.0dB", cr_6: 2, at_6: 3, rt_6: 150,
      mk_6: "5.8dB", kn_6: "-9.0dB", ce_6: 1, scm_6: 1, cm_6: 0, sla_6: 5 }

presets:
  - name: SSB DX / Contest
    mode: SSB
    radio: "SSB TX BPF 300-2700 (or 400-2600 Hz). Speech processor off."
    description: >-
      Maximum intelligibility and average power for weak-signal DX and
      pile-ups: lows cut hard below 250 Hz, a dip at 500 Hz against
      "boxiness", +7 dB of articulation around 2.1 kHz, heavier compression
      and a 2.6 kHz upper limit. Sounds thin up close, punches through noise.
    blocks:
      - id: gate
      - id: eq
        params:
          ft_0: 2   # Hi-pass 250 Hz, Butterworth x2 (24 dB/octave)
          fm_0: 2
          f_0: 250
          s_0: 1
          ft_1: 1   # Bell 500 Hz -4 dB
          f_1: 500
          g_1: "-4dB"
          q_1: 1
          ft_2: 1   # Bell 2.1 kHz +7 dB (articulation)
          f_2: 2100
          g_2: "7dB"
          q_2: 0.8
          ft_3: 0   # off
      - id: comp
        params: { al: "-30dB", cr: 6, kn: "-6dB", at: 5, rt: 80, mk: "11dB" }
      - id: exciter
        params: { amount: 1.5, drive: 6, freq: 2000 }
      - id: deesser
      - id: lpf
        params: { f: 2600 }
      - id: limiter

  - name: SSB Ragchew
    mode: SSB
    radio: "SSB TX BPF 100-2900 or 200-2800 Hz. Speech processor off."
    description: >-
      Natural, comfortable voice for strong-signal QSOs: gentle high-pass at
      120 Hz keeps some body, a small cut of the 300 Hz "mud", a little
      presence at 1.8 kHz and light compression. Upper limit 2.9 kHz.
    blocks:
      - id: gate
      - id: eq
        params:
          ft_0: 2   # Hi-pass 120 Hz, Butterworth x2
          fm_0: 2
          f_0: 120
          s_0: 1
          ft_1: 1   # Bell 300 Hz -2 dB
          f_1: 300
          g_1: "-2dB"
          q_1: 1
          ft_2: 1   # Bell 1.8 kHz +2 dB
          f_2: 1800
          g_2: "2dB"
          q_2: 1
          ft_3: 3   # Hi-shelf 2.4 kHz +1 dB
          f_3: 2400
          g_3: "1dB"
      - id: comp
        params: { al: "-22dB", cr: 3, kn: "-6dB", at: 10, rt: 150, mk: "5dB" }
      - id: deesser
      - id: lpf
        params: { f: 2900 }
      - id: limiter

  - name: ESSB Broadcast (wide)
    mode: SSB (wide)
    radio: >-
      SSB TX BPF 50-3050 Hz (or TTBF enabled, up to ~4 kHz: then raise the
      low-pass to 3.8 kHz). Only where wide SSB is acceptable and the band
      is not crowded.
    description: >-
      Broadcast-style "presenter" voice: high-pass at 60 Hz, a touch of warmth
      at 120 Hz, the 300 Hz mud cut, an open presence lift around 3 kHz,
      smooth compression with a slower attack, de-esser for the extra top end.
      Upper limit 3.2 kHz.
    blocks:
      - id: gate
        params: { gt: "-55dB", rt: 300 }
      - id: eq
        params:
          ft_0: 2   # Hi-pass 60 Hz, Butterworth x1 (12 dB/octave)
          fm_0: 2
          f_0: 60
          s_0: 0
          ft_1: 5   # Lo-shelf 120 Hz +2 dB (warmth)
          f_1: 120
          g_1: "2dB"
          ft_2: 1   # Bell 300 Hz -3 dB
          f_2: 300
          g_2: "-3dB"
          q_2: 1
          ft_3: 1   # Bell 3 kHz +3 dB (presence)
          f_3: 3000
          g_3: "3dB"
          q_3: 0.7
      - id: comp
        params: { al: "-20dB", cr: 3, kn: "-6dB", at: 15, rt: 200, mk: "5dB" }
      - id: deesser
        params: { threshold: "-20dB", f2_freq: 4000 }
      - id: lpf
        params: { f: 3200 }
      - id: limiter

  - name: AM Broadcast (4.5 kHz)
    mode: AM
    radio: >-
      AM with the radio's widest AM TX audio. Keep the carrier and the
      modulation within the radio's limits (watch the ALC); a 4.5 kHz audio
      limit gives the 9 kHz channel of European AM broadcasting.
    description: >-
      Full, "radio station" AM voice: 80 Hz high-pass, warmth at 150 Hz, a
      little mud cut, presence at 2.5 kHz and air at 3.5 kHz, broadcast-style
      compression for density, and a steep 4.5 kHz low-pass so the signal
      stays inside a 9 kHz channel.
    blocks:
      - id: gate
      - id: eq
        params:
          ft_0: 2   # Hi-pass 80 Hz, Butterworth x2
          fm_0: 2
          f_0: 80
          s_0: 1
          ft_1: 5   # Lo-shelf 150 Hz +2 dB
          f_1: 150
          g_1: "2dB"
          ft_2: 1   # Bell 2.5 kHz +2 dB
          f_2: 2500
          g_2: "2dB"
          q_2: 1
          ft_3: 3   # Hi-shelf 3.5 kHz +2 dB
          f_3: 3500
          g_3: "2dB"
      - id: comp
        params: { al: "-24dB", cr: 4, kn: "-6dB", at: 10, rt: 250, mk: "7dB" }
      - id: deesser
        params: { f2_freq: 4000 }
      - id: lpf
        # 4.3 kHz: with the +2 dB shelf above, the total is -3 dB at ~4.5 kHz
        params: { f: 4300 }
      - id: limiter

  - name: FM Narrowband
    mode: FM
    radio: >-
      FM with the radio's normal (narrow) deviation. The radio adds
      pre-emphasis (more treble) and its own deviation limiter: do not add
      treble here.
    description: >-
      Clean voice for FM/repeaters: 300 Hz high-pass (keeps the sub-audible
      CTCSS tones, 67-250 Hz, free of voice), flat mids, no treble boost because
      the radio's pre-emphasis already adds it, de-esser against the extra
      sibilance that pre-emphasis brings, gentle compression and a 3 kHz limit.
    blocks:
      - id: gate
      - id: eq
        params:
          ft_0: 2   # Hi-pass 300 Hz, Butterworth x2
          fm_0: 2
          f_0: 300
          s_0: 1
          ft_1: 1   # Bell 500 Hz -2 dB
          f_1: 500
          g_1: "-2dB"
          q_1: 1
          ft_2: 0   # off
          ft_3: 0   # off
      - id: comp
        params: { al: "-20dB", cr: 2.5, kn: "-6dB", at: 10, rt: 150, mk: "4dB" }
      - id: deesser
        params: { threshold: "-22dB" }
      - id: lpf
        params: { f: 3000 }
      - id: limiter

  - name: Natural (minimal processing)
    mode: Reference / FreeDV
    radio: >-
      Use as a reference for A/B, or when this chain feeds a digital-voice
      program (FreeDV/RADE), whose authors recommend turning all processing off.
    description: >-
      Almost transparent: noise gate, an 80 Hz high-pass against rumble and a
      safety limiter at -6 dBFS. No EQ colour, compression or exciter.
    blocks:
      - id: gate
      - id: eq
        params:
          ft_0: 2   # Hi-pass 80 Hz, Butterworth x1
          fm_0: 2
          f_0: 80
          s_0: 0
          ft_1: 0
          ft_2: 0
          ft_3: 0
      - id: limiter
        params: { th: "-6dB" }

  - name: Broadcast Deep 3 kHz
    group: Broadcast SSB
    mode: SSB 3 kHz
    radio: >-
      FTDX-101D: SSB TX BPF 50-3050. Square SDR (Zeus): TX filter 50-3000 Hz. Speech processor, TX EQ and (Zeus) leveler / compressor / CFC off;
      set the level with the Output trim until the ALC barely moves.
    description: >-
      Deepest low end: a shelf at 80 Hz and low-frequency harmonics give a big, round voice, with the 300 Hz "mud" and 600 Hz "box" taken out and a subtle exciter so it stays clear. Medium multiband density. Audio 60 Hz - 3 kHz.
    blocks:
      - { <<: *bc_hpf, params: { ft: 1, fm: 2, s: 3, mode: 0, f: 60 } }
      - *bc_nr
      - *bc_gate
      - *bc_phase
      - *bc_agc
      - id: eq
        params: { ft_0: 5, fm_0: 0, f_0: 80, s_0: 0, ft_1: 1, f_1: 300,
            g_1: "-5.0dB", q_1: 1, ft_2: 1, f_2: 600, g_2: "-2.5dB", q_2: 1.4,
            ft_3: 1, f_3: 2400, g_3: "1.0dB", mode: 0, g_0: "7.0dB", q_0: 0,
            fm_1: 0, s_1: 0, fm_2: 0, s_2: 0, fm_3: 0, s_3: 0,
            q_3: 0.8, ft_4: 0 }
      - id: bass
        params: { amount: 0.6, drive: 5, freq: 120, floor_active: 1, floor: 40, blend: 0 }
      - { <<: *bc_mbc, params: *bc_mbc_deep }
      - id: exciter
        params: { amount: 0.8, blend: 0 }
      - id: deesser
        params: { threshold: "-26.0dB", ratio: 4, f1_freq: 3000, mode: 1 }
      - id: lpf
        params: { f: 2950 }
      - id: limiter
        params: { th: "-1.0dB", lk: 5, ovs: 12 }

  - name: Broadcast Deep 4 kHz
    group: Broadcast SSB
    mode: SSB 4 kHz
    radio: >-
      FTDX-101D: only with TTBF (hidden option, 50 Hz - 4 kHz). Square SDR (Zeus): TX filter 50-4000 Hz. Speech processor, TX EQ and (Zeus) leveler / compressor / CFC off;
      set the level with the Output trim until the ALC barely moves.
    description: >-
      Deepest low end: a shelf at 80 Hz and low-frequency harmonics give a big, round voice, with the 300 Hz "mud" and 600 Hz "box" taken out and a subtle exciter so it stays clear. Medium multiband density. Audio 50 Hz - 4 kHz.
    blocks:
      - { <<: *bc_hpf, params: { ft: 1, fm: 2, s: 3, mode: 0, f: 50 } }
      - *bc_nr
      - *bc_gate
      - *bc_phase
      - *bc_agc
      - id: eq
        params: { ft_0: 5, fm_0: 0, f_0: 80, s_0: 0, ft_1: 1, f_1: 300,
            g_1: "-5.0dB", q_1: 1, ft_2: 1, f_2: 600, g_2: "-2.5dB", q_2: 1.4,
            ft_3: 1, f_3: 2800, g_3: "1.0dB", mode: 0, g_0: "7.0dB", q_0: 0,
            fm_1: 0, s_1: 0, fm_2: 0, s_2: 0, fm_3: 0, s_3: 0,
            q_3: 0.8, ft_4: 3, fm_4: 0, s_4: 0, f_4: 3400, g_4: "1.5dB",
            q_4: 0 }
      - id: bass
        params: { amount: 0.6, drive: 5, freq: 120, floor_active: 1, floor: 40, blend: 0 }
      - { <<: *bc_mbc, params: *bc_mbc_deep }
      - id: exciter
        params: { amount: 0.8, blend: 0 }
